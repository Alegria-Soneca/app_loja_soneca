{% extends 'base.html' %}
{% block content %}
<h2>Categorias</h2>
<a href="{% url 'nova_categoria' %}" class="btn btn-primary mb-3">Nova Categoria</a>
<ul class="list-group">
    {% for categoria in categorias %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ categoria.nome }}
            <span>
                <a href="{% url 'editar_categoria' categoria.id %}" class="btn btn-sm btn-warning">Editar</a>
                <a href="{% url 'excluir_categoria' categoria.id %}" class="btn btn-sm btn-danger">Excluir</a>
            </span>
        </li>
    {% empty %}
        <li class="list-group-item">Nenhuma categoria cadastrada.</li>
    {% endfor %}
</ul>
{% endblock %}
