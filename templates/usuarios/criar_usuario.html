{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Criar Usuário</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
</head>
<body class="container mt-4">

</html>
